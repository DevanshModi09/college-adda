# Render blueprint: New > Blueprint > pick this repo.
# One web service serves the API, the websocket and the built client; data lives in Neon Postgres,
# so the free plan is fine: restarts and deploys no longer lose anything.
services:
  - type: web
    name: college-adda
    runtime: node
    plan: free
    # Same region as the Neon project (aws-ap-southeast-1), and the closest to Jaipur.
    region: singapore
    buildCommand: npm ci && npm run build
    # Apply pending migrations, add demo data only if it's missing, then start.
    startCommand: npm run db:migrate -w @adda/server && npm run seed -w @adda/server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ADMIN_USERNAMES
        value: devansh
      # From the Neon console (Connect) or `npx neon@latest connection-string`. Render asks for these
      # when you apply the blueprint. Pooled URL for the app, direct URL for migrations.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Feed photos: cloudinary://<api_key>:<api_secret>@<cloud_name> (Cloudinary dashboard > API Keys).
      # Leave it empty to keep photos in Postgres.
      - key: CLOUDINARY_URL
        sync: false
